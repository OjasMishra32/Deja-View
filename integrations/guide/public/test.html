<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déjà View Guide Test</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0b0f; color: white; }
  main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; } h1 { color: #c6ff3d; } button { background:#c6ff3d; color:#0b0b0f; border:0; border-radius:6px; padding:.7rem 1rem; font-weight:800; cursor:pointer; } input { margin:.8rem 0; } #stage { position:relative; max-width:100%; } #photo { display:block; max-width:100%; } #overlay { position:absolute; inset:0; pointer-events:none; } pre { white-space:pre-wrap; background:#17171f; padding:1rem; border-radius:6px; }
</style>
<main>
  <h1>Déjà View · Guide test</h1>
  <p>Choose a room image, then test Gemini hotspots and a typed question.</p>
  <input id="file" type="file" accept="image/*"><br>
  <button id="hotspots">Find hotspots</button>
  <label>Question <input id="question" value="What is in this room?"></label>
  <button id="ask">Ask the room</button>
  <div id="stage"><img id="photo" alt="Selected room"><canvas id="overlay"></canvas></div>
  <pre id="output">Waiting for an image.</pre>
</main>
<script type="module">
  const file = document.querySelector('#file'), photo = document.querySelector('#photo'), overlay = document.querySelector('#overlay'), output = document.querySelector('#output');
  let dataUrl = '';
  file.onchange = () => { const reader = new FileReader(); reader.onload = () => { dataUrl = reader.result; photo.src = dataUrl; overlay.width = overlay.height = 0; }; reader.readAsDataURL(file.files[0]); };
  async function request(path, payload) { const response = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }); const json = await response.json(); if (!response.ok) throw new Error(json.error); return json; }
  document.querySelector('#hotspots').onclick = async () => { try { const result = await request('/hotspots', { image:dataUrl }); output.textContent = JSON.stringify(result, null, 2); overlay.width = photo.clientWidth; overlay.height = photo.clientHeight; const ctx = overlay.getContext('2d'); ctx.fillStyle = '#c6ff3d'; ctx.font = 'bold 15px system-ui'; result.hotspots.forEach(({label,x,y}) => { ctx.beginPath(); ctx.arc(x * overlay.width, y * overlay.height, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText(label, x * overlay.width + 10, y * overlay.height - 8); }); } catch (error) { output.textContent = error.message; } };
  document.querySelector('#ask').onclick = async () => { try { const result = await request('/ask', { image:dataUrl, question:document.querySelector('#question').value, scene:{id:'test-room',name:'Test room',mode:'photo'} }); output.textContent = JSON.stringify(result, null, 2); } catch (error) { output.textContent = error.message; } };
</script>
</html>
