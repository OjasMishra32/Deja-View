<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déjà View Guide Test</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0b0f; color: white; }
  main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; } h1 { color: #c6ff3d; } button { background:#c6ff3d; color:#0b0b0f; border:0; border-radius:6px; padding:.7rem 1rem; font-weight:800; cursor:pointer; } input { margin:.8rem 0; } #stage { position:relative; max-width:100%; } #photo { display:block; max-width:100%; } #overlay { position:absolute; inset:0; pointer-events:none; } pre { white-space:pre-wrap; background:#17171f; padding:1rem; border-radius:6px; }
</style>
<main>
  <h1>Déjà View · Guide test</h1>
  <p>Choose a room image, then test Gemini hotspots and a typed question. Pick a clip to test "who won?" from its frames.</p>
  <label>Guide key <input id="key" type="password" autocomplete="off"></label><br>
  <label>Scene id <input id="scene" value="test-room"></label> <select id="mode"><option>photo</option><option>video</option></select><br>
  <label>Clip <input id="clip" type="file" accept="video/*"></label> <button id="frames">Describe clip</button><br>
  <input id="file" type="file" accept="image/*"><br>
  <button id="hotspots">Find hotspots</button>
  <label>Question <input id="question" value="What is in this room?"></label>
  <button id="ask">Ask the room</button>
  <button id="talk">Hold to talk</button>
  <div id="stage"><img id="photo" alt="Selected room"><canvas id="overlay"></canvas></div>
  <pre id="output">Waiting for an image.</pre>
</main>
<script type="module">
  import { start, stop, play } from './voice-client.js';
  const file = document.querySelector('#file'), photo = document.querySelector('#photo'), overlay = document.querySelector('#overlay'), output = document.querySelector('#output');
  let dataUrl = '';
  file.onchange = () => { const reader = new FileReader(); reader.onload = () => { dataUrl = reader.result; photo.src = dataUrl; overlay.width = overlay.height = 0; }; reader.readAsDataURL(file.files[0]); };
  const scene = () => { const id = document.querySelector('#scene').value.trim() || 'test-room'; return { id, name: id, mode: document.querySelector('#mode').value }; };
  async function clipFrames(video, count = 8) { const frames = [], canvas = document.createElement('canvas'); await new Promise((done, reject) => { video.onloadeddata = done; video.onerror = () => reject(new Error('This browser cannot decode that clip')); }); const scale = Math.min(1, 768 / Math.max(video.videoWidth, video.videoHeight)); canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale); for (let i = 0; i < count; i++) { video.currentTime = Math.min(video.duration - 0.05, (video.duration * i) / (count - 1)); await new Promise((done) => { video.onseeked = done; }); canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height); frames.push(canvas.toDataURL('image/jpeg', 0.8)); } return frames; }
  async function request(path, payload) { const key = document.querySelector('#key').value; const headers = {'Content-Type':'application/json'}; if (key) headers['X-Guide-Key'] = key; const response = await fetch(path, { method:'POST', headers, body:JSON.stringify(payload) }); const json = await response.json(); if (!response.ok) throw new Error(json.error); return json; }
  document.querySelector('#hotspots').onclick = async () => { try { const result = await request('/hotspots', { image:dataUrl, scene:scene() }); output.textContent = JSON.stringify(result, null, 2); overlay.width = photo.clientWidth; overlay.height = photo.clientHeight; const ctx = overlay.getContext('2d'); ctx.fillStyle = '#c6ff3d'; ctx.font = 'bold 15px system-ui'; result.hotspots.forEach(({label,x,y}) => { ctx.beginPath(); ctx.arc(x * overlay.width, y * overlay.height, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText(label, x * overlay.width + 10, y * overlay.height - 8); }); } catch (error) { output.textContent = error.message; } };
  document.querySelector('#ask').onclick = async () => { try { const result = await request('/ask', { image:dataUrl, question:document.querySelector('#question').value, scene:scene() }); output.textContent = JSON.stringify(result, null, 2); } catch (error) { output.textContent = error.message; } };
  document.querySelector('#frames').onclick = async () => { const clip = document.querySelector('#clip').files[0]; if (!clip) { output.textContent = 'Pick a clip first.'; return; } const video = document.createElement('video'); video.muted = true; video.preload = 'auto'; video.src = URL.createObjectURL(clip); try { output.textContent = 'Taking 8 frames...'; const frames = await clipFrames(video); const result = await request('/describe', { frames, scene:scene() }); output.textContent = JSON.stringify(result, null, 2); } catch (error) { output.textContent = error.message; } finally { URL.revokeObjectURL(video.src); } };
  const talk = document.querySelector('#talk');
  talk.onpointerdown = async () => { try { await start(); talk.textContent = 'Release to ask'; } catch (error) { output.textContent = error.message; } };
  talk.onpointerup = async () => { try { const recording = await stop(); const result = await request('/ask', { image:dataUrl, audio:recording.dataUrl, scene:scene() }); output.textContent = JSON.stringify({...result, recordedSeconds:recording.seconds}, null, 2); await play(result.speech); } catch (error) { output.textContent = error.message; } finally { talk.textContent = 'Hold to talk'; } };
</script>
</html>
